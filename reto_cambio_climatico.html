<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reto Cambio Climático</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#dff6ff,#e9f8e2);margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;color:#17324d}.card{max-width:720px;width:100%;background:#fff;border-radius:24px;padding:28px;box-shadow:0 10px 30px #0002}h1{color:#176b45}.center{text-align:center}.hidden{display:none}.meta{display:flex;justify-content:space-between;font-weight:bold}.barbg{height:9px;background:#e7edf0;border-radius:10px;margin:15px 0 22px}.bar{height:100%;background:#25a66a;border-radius:10px;transition:.3s}.question{font-size:21px;font-weight:bold;line-height:1.4;margin-bottom:18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #d9e4e8;border-radius:14px;background:white;text-align:left;font-size:16px;cursor:pointer}.correct{background:#d9f7e5!important;border-color:#25a66a!important}.wrong{background:#ffe0e0!important;border-color:#e05252!important}.feedback{min-height:45px;margin-top:15px;font-weight:bold;line-height:1.4}.good{color:#168447}.bad{color:#c53636}.main{border:0;background:#176b45;color:#fff;padding:13px 22px;border-radius:13px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:15px}.score{font-size:30px;font-weight:bold;color:#176b45}
</style></head><body><div class="card">
<section id="start" class="center"><div style="font-size:55px">🌎🌱</div><h1>Reto: Cambio Climático</h1><p>Responde las 10 preguntas y comprueba cuánto aprendiste.</p><button class="main" onclick="start()">▶ Comenzar juego</button></section>
<section id="game" class="hidden"><div class="meta"><span id="num"></span><span id="pts">Puntos: 0</span></div><div class="barbg"><div id="bar" class="bar" style="width:10%"></div></div><div id="q" class="question"></div><div id="opts" class="options"></div><div id="fb" class="feedback"></div><button id="next" class="main hidden" onclick="next()">Siguiente →</button></section>
<section id="end" class="hidden center"><div style="font-size:55px">🎉</div><h1>¡Juego terminado!</h1><p id="final" class="score"></p><p id="msg"></p><button class="main" onclick="restart()">🔄 Jugar de nuevo</button></section>
</div>
<script>
const qs=[
["¿Qué es el cambio climático?",["Un cambio momentáneo del tiempo.","Un cambio a largo plazo en las condiciones habituales del clima.","Una estación del año.","Un fenómeno que solo ocurre en los océanos."],1,"El cambio climático se refiere a cambios a largo plazo en las condiciones habituales del clima."],
["¿Cuál es la diferencia principal entre mitigación y adaptación?",["La mitigación disminuye las causas y la adaptación ayuda a enfrentar sus efectos.","La mitigación solo sirve para animales.","Son exactamente lo mismo.","La adaptación elimina todas las causas."],0,"La mitigación busca reducir las causas; la adaptación busca disminuir la vulnerabilidad ante sus efectos."],
["¿Cuál es un ejemplo de mitigación?",["Prepararse para una inundación.","Construir un sistema de alerta.","Usar responsablemente la energía y reducir residuos.","Evacuar una zona de riesgo."],2,"El uso responsable de la energía y la reducción de residuos son acciones de mitigación."],
["Verdadero o falso: La psicología ambiental ayuda a comprender cómo las personas perciben los problemas ambientales y cómo pueden cambiar sus comportamientos.",["Verdadero","Falso"],0,"La psicología ambiental ayuda a comprender la relación entre las personas y su entorno."],
["Una comunidad está en riesgo de inundaciones. ¿Cuál sería una medida de adaptación?",["Aumentar el consumo de energía.","Crear sistemas de alerta y preparar a la comunidad.","Eliminar los espacios verdes.","Producir más residuos."],1,"Los sistemas de alerta y la preparación ayudan a reducir la vulnerabilidad."],
["¿Qué diferencia caracteriza a El Niño y La Niña?",["El Niño se relaciona con aguas más cálidas del Pacífico y La Niña con aguas más frías.","Ambos siempre producen exactamente el mismo clima.","El Niño ocurre solo en tierra.","La Niña siempre produce temperaturas más altas del Pacífico."],0,"El Niño se relaciona con un calentamiento del Pacífico y La Niña con un enfriamiento."],
["Después de un desastre ambiental, además de los daños físicos y materiales, ¿qué consecuencias deben atenderse?",["Solo las económicas.","Las consecuencias emocionales.","Ninguna consecuencia.","Solo las relacionadas con el transporte."],1,"También pueden aparecer miedo, tristeza, estrés e incertidumbre."],
["En el caso de Mocoa presentado en la exposición, ¿qué emociones pudieron experimentar las personas afectadas?",["Alegría y tranquilidad.","Miedo, tristeza, estrés e incertidumbre.","Aburrimiento y diversión.","Solo enojo."],1,"El caso muestra consecuencias emocionales como miedo, tristeza, estrés e incertidumbre."],
["¿Cómo se llama la preocupación o angustia relacionada con el deterioro ambiental y el cambio climático?",["Ecoansiedad.","Alegría ambiental.","Adaptación climática.","Mitigación social."],0,"La ecoansiedad se refiere a sentimientos de preocupación o angustia relacionados con problemas ambientales."],
["Verdadero o falso: El cambio climático puede afectar no solo al medio ambiente, sino también la forma en que las personas viven, sienten y se relacionan con su entorno.",["Verdadero","Falso"],0,"El cambio climático puede afectar la vida de las personas y su relación con el entorno."]
];
let i=0,score=0,done=false;
function start(){document.getElementById("start").classList.add("hidden");document.getElementById("game").classList.remove("hidden");render()}
function render(){done=false;let x=qs[i];document.getElementById("num").textContent="Pregunta "+(i+1)+" de 10";document.getElementById("pts").textContent="Puntos: "+score;document.getElementById("bar").style.width=((i+1)*10)+"%";document.getElementById("q").textContent=x[0];document.getElementById("fb").textContent="";document.getElementById("fb").className="feedback";document.getElementById("next").classList.add("hidden");let box=document.getElementById("opts");box.innerHTML="";x[1].forEach((t,n)=>{let b=document.createElement("button");b.className="option";b.textContent=t;b.onclick=()=>answer(n,b);box.appendChild(b)})}
function answer(n,b){if(done)return;done=true;let x=qs[i];[...document.querySelectorAll(".option")].forEach((z,j)=>{z.disabled=true;if(j===x[2])z.classList.add("correct")});let f=document.getElementById("fb");if(n===x[2]){score++;b.classList.add("correct");f.textContent="✅ ¡Correcto! "+x[3];f.className="feedback good"}else{b.classList.add("wrong");f.textContent="❌ ¡Incorrecto! "+x[3];f.className="feedback bad"}document.getElementById("pts").textContent="Puntos: "+score;document.getElementById("next").textContent=i===9?"Ver resultado →":"Siguiente →";document.getElementById("next").classList.remove("hidden")}
function next(){if(i===9){document.getElementById("game").classList.add("hidden");document.getElementById("end").classList.remove("hidden");document.getElementById("final").textContent=score+" / 10 puntos";document.getElementById("msg").textContent=score===10?"🌟 ¡Excelente! Dominas el tema.":score>=7?"👏 ¡Muy bien! Tienes un buen manejo del tema.":"📚 ¡Buen intento! Repasa el tema y vuelve a jugar."}else{i++;render()}}
function restart(){i=0;score=0;document.getElementById("end").classList.add("hidden");document.getElementById("game").classList.remove("hidden");render()}
</script></body></html>
